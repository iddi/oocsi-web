# This is the main configuration file for the application.
# ~~~~~

oocsi.clients=1000
oocsi.port=4444
oocsi.logging=true

oocsi.ratelimit.enabled=true
oocsi.ratelimit.capacity=120
oocsi.ratelimit.refillTokens=120
oocsi.ratelimit.refillDurationSeconds=60

play.http.secret.key="change this change this change this"

play.filters.enabled += "play.filters.cors.CORSFilter"

play.filters.cors {
  # Allows any origin by default for open prototyping/classroom environments
  # For production lockdowns, specify explicit origins: allowedOrigins = ["https://oocsi.example.com"]
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "X-Requested-With"]
}

play.filters.csp.CSPFilter = "default-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' 'unsafe-inline' data: *; connect-src *;"

# Host filter configuration:
# Default allowed = ["."] allows connections from arbitrary LAN IPs, Raspberry Pis, and local dev environments.
# For production deployments, specify allowed domains:
#   allowed = ["oocsi.example.com", "localhost:9000", "127.0.0.1:9000"]
# Test in production with: curl -H "Host: evil.com" -I http://localhost:9000/ (should return 400 Bad Request)
play.filters.hosts {
  allowed = ["."]
}
