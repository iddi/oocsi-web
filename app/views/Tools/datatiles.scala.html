@(message: String, title: String, address: String)
<!DOCTYPE html>
<html lang="en">
    <head>
  		<meta charset="utf-8">
        <title>OOCSI Dashboard</title>
        <link rel="shortcut icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")"/>

		<!--Let browser know website is optimized for mobile-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		
        <link rel="stylesheet" media="screen,projection" type="text/css" href="@routes.Assets.versioned("css/main.css")"/>
        
        <script src="@routes.Assets.versioned("js/oocsi-web.min.js")" type="text/javascript"></script>
        <script src="@routes.Assets.versioned("js/materialize.min.js")" type="text/javascript"></script>
        <style type="text/css">
			body {
				font-family: sans-serif;
			}

			#charts > div {
				padding-bottom: 1rem;
				border-bottom: 1px dotted lightgray;
				clear: both;
			}

			#charts .tile {
				width: 15%;
				min-width:  6rem;
				height: 5rem;
				float: left;
				margin-right: 2%;
				font-size: 2rem;
				text-align: center;
			}

			#charts .tile span {
				display: block;
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
				margin: 0 auto;
				color: black;
			}

			#charts .tile label {
				display: block;
				font-size: 1rem;
				color: grey;
			}
			#charts .tile div {
				font-size: 0.5rem;
				color: grey;
			}
		</style>
    </head>
    <body>

		@elements.navigation("tools")

		<div class="container">
			<div class="row" id="charts">
			</div>
			<div class="row" style="margin-top: 2rem; border-top: #efefef solid 1px;">
				<div class="col s12">
		    		<a class="btn" id="addChannelBtn" href="#">add channel</a>
		    	</div>
			</div>
		</div>
		<script type="text/javascript">

			document.addEventListener("DOMContentLoaded", function() {

				const ticks = ['▁','▂','▃','▄','▅','▆','▇','█']
				let channels = []
				let values = {}
				let charts = document.getElementById('charts')
				// let html = ''

				// connect to OOCSI server
				OOCSI.connect((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws', 'OOCSI/tools/datatiles_####');

				// add charts
				var json = readCookie('channels');
				try {
					var channelLoader = JSON.parse(json);
					if(Array.isArray(channelLoader) && channelLoader.length > 0) {
						for(let channel of channelLoader) {
							if (typeof channel === 'string' && /^[a-zA-Z0-9_\-\.\:\/]+$/.test(channel)) {
								addChannel(channel);
							}
						}
					} else {
						addChannel("testchannel");
					}
				} catch(e) {
					addChannel("testchannel");
				}

				// add add handler
				document.getElementById('addChannelBtn').addEventListener('click', function() {
					let channel = prompt("Enter name for channel to be added:")
					if(channel !== undefined && channel !== "" && /^[a-zA-Z0-9_\-\.\:\/]+$/.test(channel)) {
						addChannel(channel)
					}
				})

		    	createCookie('channels', JSON.stringify(channels));

				function processData(e) {
					if (!e || !e.data || typeof e.data !== 'object') return;
					for(const key in e.data) {
						if (!Object.prototype.hasOwnProperty.call(e.data, key)) continue;
						if (key === '__proto__' || key === 'prototype' || key === 'constructor') continue;
						const channel = e.recipient
						const handle = channel+"___"+key
						if(values[handle] === undefined) {
							addTile(channel, key)
							values[handle] = { min: 100000, current: 0, max: 0, ticks: [] }
						}

						// check for number
						let value = e.data[key]
						if(!isNaN(Math.abs(value))) {
							value = Math.round(value * 10) / 10
							values[handle].current = value
							values[handle].min = Math.min(value, values[handle].min)
							values[handle].max = Math.max(value, values[handle].max)
							var elem = document.getElementById(`${e.recipient}___${key}`)
							if (elem) {
								elem.innerText = values[handle].current
								elem.title = values[handle].current
							}
							if(values[handle].max > 0) {
								let s = (values[handle].current - values[handle].min) / (values[handle].max - values[handle].min)
								s = Math.round(s * 7)
								if(s !== NaN) {
									if(values[handle].ticks.length > 10) { values[handle].ticks.shift(); }
									values[handle].ticks.push(ticks[s])
									var slElem = document.getElementById(`${channel}___${key}_sl`)
									if (slElem) slElem.innerText = values[handle].ticks.join('')
								}
							}
						} else {
							var elem = document.getElementById(`${e.recipient}___${key}`)
							if (elem) {
								elem.innerText = value
								elem.title = value
							}
						}
					}
				}

				function addChannel(channel) {
					if (!channel || typeof channel !== 'string' || !/^[a-zA-Z0-9_\-\.\:\/]+$/.test(channel)) {
						return;
					}
					let elem = document.createElement('div')
					charts.append(elem)

					let col = document.createElement('div')
					col.className = 'col s12'
					col.id = 'channel-' + channel

					let h3 = document.createElement('h3')
					h3.textContent = channel + ' '

					let small = document.createElement('small')
					let delLink = document.createElement('a')
					delLink.href = '#'
					delLink.id = 'delete-' + channel
					delLink.title = 'delete this channel'
					delLink.textContent = '🚮'
					small.appendChild(delLink)
					h3.appendChild(small)

					let tiles = document.createElement('div')
					tiles.className = 'tiles'
					tiles.id = channel

					col.appendChild(h3)
					col.appendChild(tiles)
					elem.appendChild(col)

					OOCSI.subscribe(channel, processData)
					channels.push(channel);
			    	createCookie('channels', JSON.stringify(channels))

					delLink.addEventListener('click', function(e) {
						e.preventDefault()
						OOCSI.unsubscribe(channel)
						var idx = channels.indexOf(channel)
						if (idx !== -1) {
							channels.splice(idx, 1)
						}
						elem.remove()
						for(var v in values) {
							if(v.startsWith(channel+"___")) {
								delete values[v];
							}
						}
				    	createCookie('channels', JSON.stringify(channels))
					})
				}

				function addTile(channel, key) {
					const handle = channel+"___"+key
					const newEl = document.createElement('div')
					newEl.className = 'tile';

					const span = document.createElement('span')
					span.id = handle
					span.textContent = '0'

					const label = document.createElement('label')
					label.textContent = key

					const sl = document.createElement('div')
					sl.id = handle + '_sl'

					newEl.appendChild(span)
					newEl.appendChild(label)
					newEl.appendChild(sl)

					const target = document.getElementById(channel)
					if (target) {
						target.append(newEl)
					}
				}

				/******************************************************************/

				function createCookie(name, value, days) {
				    var expires;

				    if (days) {
				        let date = new Date();
				        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
				        expires = "; expires=" + date.toGMTString();
				    } else {
				        expires = "";
				    }
				    var secure = window.location.protocol === 'https:' ? '; Secure' : '';
				    document.cookie = encodeURIComponent(name) + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Strict" + secure;
				}

				function readCookie(name) {
				    var nameEQ = encodeURIComponent(name) + "=";
				    var ca = document.cookie.split(';');
				    for (var i = 0; i < ca.length; i++) {
				        var c = ca[i];
				        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
				        if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
				    }
				    return null;
				}

				function eraseCookie(name) {
				    createCookie(name, "", -1);
				}
			});

		</script>

        <script src="@routes.Assets.versioned("js/oocsi-chat.min.js")" type="text/javascript"></script>
	</body>
</html>
